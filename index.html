<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <!-- Le zoom reste AUTORISÉ : couper le pincement prive de la page ceux
       qui en ont besoin pour la lire. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Matteo — Le site arrive</title>
  <meta name="description" content="Le site arrive." />
  <link rel="canonical" href="https://matteoth.com/" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://matteoth.com/" />
  <meta property="og:title" content="Matteo — Le site arrive" />
  <meta property="og:description" content="Le site arrive." />
  <meta property="og:locale" content="fr_FR" />

  <!-- Tous dérivés d'une seule photo par scripts/marque.py. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=3" />
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/favicon-192.png?v=3" />
  <!-- Safari demande /apple-touch-icon.png à la racine sans lire ce HTML :
       le fichier ne peut pas déménager. -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=3" />
  <meta name="theme-color" content="#02030a" />

  <!-- Polices servies par le site (voir assets/fonts.css). Le crossorigin
       n'est pas décoratif : sans lui le préchargement est refait. -->
  <link rel="preload" href="/assets/fonts/general-sans-700.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/assets/fonts.css" />
  <link rel="stylesheet" href="/assets/site.css?v=4" />
</head>

<body class="plein">
  <div class="lueur" aria-hidden="true"></div>
  <div class="horizon" aria-hidden="true"></div>
  <div class="filet" aria-hidden="true"></div>
  <div class="halo vif" aria-hidden="true"></div>
  <div class="halo clair" aria-hidden="true"></div>
  <div class="halo blanc" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- La marque à gauche, la barre à droite : la même disposition que la
       page Aulne, dans les couleurs du site. -->
  <header class="entete">
    <a class="marque" href="/"><img src="/assets/profil.jpg?v=3" alt="" width="32" height="32" />matteoth</a>
    <nav class="barre" aria-label="Navigation">
      <a href="/" aria-current="page">Accueil</a>
      <a href="/mrr">MRR</a>
      <a href="/aulne">Aulne</a>
    </nav>
  </header>

  <main>
    <img src="/assets/profil.jpg?v=3" alt="Matteo" class="profil" width="104" height="104" />
    <h1 class="titre">Le site<br />arrive<span class="point">.</span></h1>
  </main>
</body>
</html>
